name: verify
on: [push, pull_request]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python compile gate
        run: python3 -m py_compile $(git ls-files '*.py')
      - name: Real 5720-case replay
        run: python3 VERIFICATION/sv001_v2_check.py
      - name: Bell test
        run: python3 VERIFICATION/replay_harness.py
