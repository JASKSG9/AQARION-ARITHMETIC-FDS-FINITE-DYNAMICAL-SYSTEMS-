name: verify
on: [push, pull_request]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python compile gate — all .py must be valid
        run: |
          python3 -m py_compile $(git ls-files '*.py')
          echo "py_compile PASS"
      - name: Bell / K2,5 / F subadditivity / spectral replay
        run: |
          python3 VERIFICATION/replay_harness.py
      - name: Lean build (from canonical subdir)
        working-directory: AQARION-LAKE
        run: |
          ls lean-toolchain
          lake build
