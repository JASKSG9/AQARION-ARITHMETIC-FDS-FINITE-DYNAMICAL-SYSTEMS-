name: verify
on: [push, pull_request]
jobs:
  replay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AQARION-LAKE
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean4@v4.33.1
        with:
          toolchain: leanprover/lean4:v4.33.1
      - name: py-compile gate
        run: python -m py_compile $(git ls-files '*.py' | tr '\n' ' ')
      - name: replay harness
        run: python../VERIFICATION/replay_harness.py
      - name: lake build
        run: lake build
