[package]
name = "aqarion-atlas-core"
version = "1.2.0"
edition = "2021"
authors = ["AQARION Research Node #10878"]
description = "Computational certificate engine for AQARION defect gap conjecture"
publish = false

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-rational = "0.4"
num-bigint = "0.4"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
