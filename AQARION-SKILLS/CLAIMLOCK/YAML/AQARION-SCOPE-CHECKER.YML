name: aqarion-claim-extractor
description: Extract typed claims from research artifacts without promotion authority.
version: 0.2

input:
  artifact: path to paper/code/transcript
  extraction_mode: [theorem, empirical, software_property, benchmark]

output:
  claims:
    - id: auto-generated (content-addressed)
      text: normalized statement (decontextualized)
      scope: INSTANCE | FINITE_FAMILY | PARAMETERIZED | UNIVERSAL
      evidence_references: [list of artifact locations]
      extraction_confidence: 0.0-1.0
      raw_quote: exact text span
      extraction_warnings: [list]

non_authority_clause: |
  This skill CANNOT assign status. It can only extract and classify.
  Promotion requires a separate policy engine.
