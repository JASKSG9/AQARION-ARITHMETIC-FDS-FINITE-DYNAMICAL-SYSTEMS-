[project]
name = "aqarion-arithmetic"
version = "0.1.0-experiment"
manifest_version = "0.2"
status = "EXPERIMENTAL_NO_PROMOTION"

[claim.SV-001-V2]
statement = """
For the explicitly defined equal-block cyclic-shift model,
the verifier tests the reduced-Gram identity
U^T D^T D U = alpha^2 (2I - S - S^{-1}),
where alpha^2 = r(k-r)/k^2 and r = s mod k.
"""
scope = "finite numerical regression only"
formal_status = "OPEN"
promotion_allowed = false

[claim.SV-001-V2.domain]
m_min = 2
m_max = 8
k_min = 2
k_max = 8
shift_rule = "1 <= s < m*k"
nontrivial_rule = "r = s mod k != 0 gives 980 cases; inclusive gives 1176 cases"
total_inclusive = 1176
total_nontrivial = 980

[claim.SV-001-V2.conventions]
koopman_matrix = "K[x,(x+s) mod n]=1"
defect_operator = "D=(I-P)K_sP"
reduced_gram = "G=U^T D^T D U"
cycle_laplacian = "L=2I-S-S^{-1}"
m2_rule = "For m=2, L=[[2,-2],[-2,2]]"
orthonormal_basis = "U[b*k:(b+1)*k,b]=1/sqrt(k)"
projector = "P[block,block]=1/k"

[claim.SV-001-V2.tolerance]
matrix_frobenius_absolute = 1.0e-12
spectrum_l2_absolute = 1.0e-12
require_finite_outputs = true
require_solver_convergence = true

[artifact.sv001_verifier]
path = "VERIFICATION/sv001_v2_check.py"
sha256 = "66181bfea90c7f43c93a407043c17ef7e809e65ec07b5c4b508c73abcfd91347"
sha256_status = "VERIFIED"
executable = true

[environment]
python_exact = "3.9.25"
numpy_exact = "1.26.4"
platform = "Linux-6.18.48-rFBS9c3683fc50680b-x86_64-with-glibc2.34"
